name: Build and Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A newer push to the same PR supersedes the running build. Master and
# tag builds are never cancelled, so every release still gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve mabur and devourer master once, for every board. The package .mk
  # files take MABUR_VERSION/DEVOURER_VERSION from the environment, so all the
  # images are built from exactly these commits and the release is named
  # after the mabur one -- the same mabur-<sha8> name openipc-builder gives
  # the VTX firmware built from that commit, which is how a VTX and a GS
  # release are matched.
  resolve:
    name: Resolve sources
    runs-on: ubuntu-latest
    outputs:
      mabur: ${{ steps.sha.outputs.mabur }}
      devourer: ${{ steps.sha.outputs.devourer }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - id: sha
        run: |
          MABUR=$(git ls-remote https://github.com/gilankpam/mabur.git refs/heads/master | cut -f1)
          DEVOURER=$(git ls-remote https://github.com/gilankpam/devourer.git refs/heads/master | cut -f1)
          if [ -z "$MABUR" ] || [ -z "$DEVOURER" ]; then
            exit 1
          fi
          echo "mabur=$MABUR" >> $GITHUB_OUTPUT
          echo "devourer=$DEVOURER" >> $GITHUB_OUTPUT
          echo "tag=mabur-${MABUR:0:8}" >> $GITHUB_OUTPUT

  buildroot:
    name: Build Firmware
    needs: resolve
    # Pinned: the ubuntu-26.04 image behind ubuntu-latest has no
    # qemu-user-static package.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        platform:
          - radxa_zero3
          - runcam_wifilink
          - emax_wyvern-link
          - orangepi_zero2w

    steps:

      - name: Display free disk space
        run: df -hT

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo apt update
          sudo apt install -y cpio rsync bc qemu-user-static binfmt-support
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo bash -
          sudo apt install -y nodejs
          sudo mkdir -p /mnt/workspace
          sudo chown $USER:$USER /mnt/workspace
          rsync -a "$GITHUB_WORKSPACE/" /mnt/workspace/

      # Unique key per run: actions/cache never re-saves on an exact key
      # hit, so a fixed key freezes the cache at its first save. Restore
      # the newest one by prefix and save a fresh one after every build.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ${{ matrix.platform }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.platform }}-ccache-

      - name: Build firmware
        working-directory: /mnt/workspace
        env:
          MABUR_VERSION: ${{ needs.resolve.outputs.mabur }}
          DEVOURER_VERSION: ${{ needs.resolve.outputs.devourer }}
        run: |
          export GIT_HASH=$(git rev-parse --short $GITHUB_SHA)
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_BRANCH}" >> $GITHUB_ENV

          mkdir -p /tmp/ccache
          export BR2_CCACHE_DIR=/tmp/ccache
          # Three boards share the 10 GB repo cache quota
          export CCACHE_MAXSIZE=3G

          NAME=${{ matrix.platform }}
          DEFCONFIG=${NAME}_defconfig bash build.sh

      - name: ccache stats
        if: always()
        working-directory: /mnt/workspace
        run: BR_CACHE_DIR=/tmp/ccache output/${{ matrix.platform }}_defconfig/host/bin/ccache -s || true

      # Save even when the build fails or is cancelled: a half-finished
      # LLVM compile is still worth keeping for the next run.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ${{ matrix.platform }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload images to workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-images-${{ github.sha }}
          path: |
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_sdcard.img
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_boot.scr
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_u-boot.bin
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_emmc_bootloader.img
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}_rootfs.squashfs
            /mnt/workspace/output/${{ matrix.platform }}_defconfig/images/${{ matrix.platform }}.tar.gz
          retention-days: 7

  release-on-master:
    name: Release mabur build (manual run)
    runs-on: ubuntu-latest
    needs: [resolve, buildroot]
    # Only a manual run (workflow_dispatch) on master publishes; a push just
    # builds. Never PRs; tags go to release-on-tag. A rerun against the same
    # mabur commit replaces that release's files.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create/Update mabur release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body: |
            Ground-station images for `${{ needs.resolve.outputs.tag }}`, built from mabur `${{ needs.resolve.outputs.mabur }}`.
            Flash them with the VTX release of the same name:
            https://github.com/gilankpam/openipc-builder/releases/tag/${{ needs.resolve.outputs.tag }}

            - mabur: `${{ needs.resolve.outputs.mabur }}`
            - devourer: `${{ needs.resolve.outputs.devourer }}`
            - Builder commit: `${{ github.sha }}`
          files: artifacts/**/*
          prerelease: false
          make_latest: true

  release-on-tag:
    name: Release Version (on tag)
    runs-on: ubuntu-latest
    needs: [buildroot]
    # Only run when pushing tags
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Stable release ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: artifacts/**/*
          draft: false
          prerelease: false
