# Orange Pi Zero 2W SD image (Allwinner sunxi)
# Just SPL + squashfs rootfs; the firstboot /init creates+formats the overlay,
# CONFIG and DVR partitions and expands them to fill the SD (needs the real
# mke2fs from e2fsprogs — busybox mke2fs can't do `-t ext4`, see
# BR2_PACKAGE_E2FSPROGS).
#
# GPT, like the other boards: /init's carve_part names every partition it
# creates, and an MBR has no name field (it also caps the disk at four
# primaries, exactly rootfs + overlay + CONFIG + DVR).
image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	# sunxi SPL + U-Boot, written raw (not in the partition table) at the
	# BootROM's "high" location. The traditional 8 KiB slot sits inside the GPT
	# entry array (LBA 2-33); on the H616/H618 the alternative is 256 KiB, not
	# the 128 KiB of older sunxi SoCs, and the SPL finds U-Boot proper relative
	# to whichever one it booted from.
	partition spl {
		in-partition-table = "false"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 256K
	}

	# rootfs starts well past the U-Boot reservation
	partition rootfs {
		partition-type-uuid = L
		image = "rootfs.squashfs"
		offset = 16M
		bootable = true
	}
}
